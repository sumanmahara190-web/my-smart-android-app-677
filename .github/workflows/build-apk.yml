name: Auto Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Initialize & Build Android Project Automatically
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init "ColorPop Kids   Image Color Filling App" "com.easyapp.colorpopkidsimagecolorfillingapp" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Ready Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorPop_Kids___Image_Color_Filling_App-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
